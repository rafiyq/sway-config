# Consolidate Chromium, Brave, and Firefox (X11 and Wayland)
for_window [class="(?i)(chromium|brave|firefox)"] mark Browser
for_window [app_id="(?i)(chromium|brave-browser|firefox)"] mark Browser

### Logic for Marked Browsers
for_window [con_mark="Browser"] {
    # Inhibit idle/sleep when a browser is fullscreen (e.g., YouTube/Netflix)
    inhibit_idle fullscreen
}

# Picture-in-Picture handling for marked browsers
for_window [con_mark="Browser" title="(?i)picture.in.picture"] {
    floating enable
    sticky enable
    border none
}

### Screen Sharing Indicators
# Move Firefox indicator to scratchpad to hide it from the UI
for_window [title="Firefox .*— Sharing Indicator"] floating enable, sticky enable, move to scratchpad
for_window [title=".* is sharing your screen."] floating enable, sticky enable
